name: E2E

# Boots a real Home Assistant in Docker next to a simulated Dyson fan (an MQTT
# broker plus firmware simulator), adds the fan through the config flow and
# drives it through Home Assistant's API. See tests/e2e/.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Home Assistant ${{ matrix.ha-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Breakage on the upcoming release is an early warning, not a merge blocker.
    continue-on-error: ${{ matrix.ha-version == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version (keep in sync with hacs.json), current, and upcoming.
        ha-version: ["2024.11.0", "stable", "beta"]
    env:
      HA_VERSION: ${{ matrix.ha-version }}
      COMPOSE_FILE: tests/e2e/docker-compose.yml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_e2e.txt
      - run: pip install -r requirements_e2e.txt
      - name: Start Home Assistant and the simulated fan
        run: docker compose up --detach --wait --wait-timeout 600
      - name: Run e2e tests
        run: pytest tests/e2e -v
      - name: Home Assistant logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
