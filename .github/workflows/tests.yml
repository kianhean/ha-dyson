name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_lint.txt
      - run: pip install -r requirements_lint.txt
      - run: ruff check --output-format=github custom_components tests

  pytest:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements_test.txt
      - name: Run pytest
        run: >-
          pytest
          --cov=custom_components.dyson_local
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=pytest-results.xml
      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print(f"### Line coverage: {rate:.1%}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            coverage.xml
